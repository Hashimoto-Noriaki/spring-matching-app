spring.application.name=matching

# ---- データベース(H2)の設定 ----
# file: にすると、アプリを止めてもデータがファイルに残る
spring.datasource.url=jdbc:h2:file:./data/matchingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA の設定 ----
# エンティティ(Javaクラス)の定義を見て、テーブルを自動で作る
spring.jpa.hibernate.ddl-auto=update
# 実行される SQL をコンソールに表示する(勉強用。何が起きてるか見える)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 コンソール(ブラウザで DB の中身を見る画面)----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
